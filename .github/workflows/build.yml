name: Build Almus Studio APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu-latest runners already ship with a working Android
      # SDK + licenses pre-accepted at $ANDROID_HOME. The previous approach
      # used the android-actions/setup-android action, which decided the
      # preinstalled cmdline-tools were "the wrong version" and downloaded a
      # fresh copy with NO pre-accepted licenses - that fresh copy then
      # blocked forever on an interactive license prompt. Using the runner's
      # own preinstalled SDK directly sidesteps that. However, $ANDROID_HOME
      # itself is set, but its cmdline-tools/bin folder is NOT automatically
      # on PATH on every runner image, which is what "sdkmanager: command
      # not found" (exit 127) meant - so we locate it explicitly here and
      # add it to PATH for every step after this one.
      - name: Locate sdkmanager and add it to PATH
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          CANDIDATE="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ -x "$CANDIDATE/sdkmanager" ]; then
            FOUND_DIR="$CANDIDATE"
          else
            FOUND_FILE=$(find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -n 1)
            if [ -z "$FOUND_FILE" ]; then
              echo "::error::Could not locate sdkmanager anywhere under $ANDROID_HOME"
              exit 1
            fi
            FOUND_DIR=$(dirname "$FOUND_FILE")
          fi
          echo "Using sdkmanager at $FOUND_DIR/sdkmanager"
          echo "$FOUND_DIR" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      # Using gradle/actions/setup-gradle to provision Gradle itself means the
      # build works even though this repository does not commit a binary
      # gradle-wrapper.jar (see README "Gradle wrapper note"). It also gives
      # us dependency-cache restore/save for free.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
        working-directory: .

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        working-directory: .

      - name: Report test results on failure
        if: failure()
        run: |
          echo "Build or tests failed. See the logs above for the failing task."
          find . -path "*/build/test-results/*.xml" -exec echo "--- {} ---" \; -exec cat {} \; || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: almus-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/**/*.xml
          if-no-files-found: ignore
